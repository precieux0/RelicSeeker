name: Build Signed APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with: { distribution: 'temurin', java-version: '17' }
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install NDK 25.2.9519653
        run: sdkmanager "ndk;25.2.9519653" "platforms;android-33" "build-tools;33.0.2"
      - name: Create keystore
        run: |
          keytool -genkey -v -keystore $PWD/relic.keystore -alias relic -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=OKIT, OU=ID, O=OKIT Games, L=City, S=State, C=FR"
          echo "KEYSTORE_PATH=$PWD/relic.keystore" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=123456" >> $GITHUB_ENV
          echo "KEY_ALIAS=relic" >> $GITHUB_ENV
          echo "KEY_PASSWORD=123456" >> $GITHUB_ENV
      - name: Grant gradlew exec
        run: chmod +x ./gradlew
      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RelicSeeker-signed
          path: app/build/outputs/apk/release/*.apk
      - name: Upload native debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: native-symbols
          path: app/build/intermediates/cxx/**/obj/**/*.so
