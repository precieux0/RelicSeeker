name: Build Debug APK (with debuggable)

on: [push, workflow_dispatch]

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK 25.2.9519653
        run: sdkmanager "ndk;25.2.9519653" "platforms;android-33" "build-tools;33.0.2"

      - name: Grant gradlew exec
        run: chmod +x ./gradlew

      # Build debug APK (non signée, debuggable=true)
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RelicSeeker-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload native debug symbols (if needed)
        uses: actions/upload-artifact@v4
        with:
          name: native-symbols-debug
          path: app/build/intermediates/cxx/**/obj/**/*.so
