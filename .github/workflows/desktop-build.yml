name: Desktop Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libglfw3-dev libglew-dev libgl1-mesa-dev
      - name: Configure CMake
        run: |
          cd desktop
          cmake .
      - name: Build
        run: |
          cd desktop
          cmake --build . --config Release
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: relicseeker-desktop
          path: desktop/RelicSeekerDesktop
